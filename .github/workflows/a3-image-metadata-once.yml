name: A3 canonical image metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/a3-image-metadata-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Align research image metadata with canonical identity
        shell: python
        run: |
          from pathlib import Path

          image = "https://avatars.githubusercontent.com/u/3828735?v=4"

          p = Path("index.html")
          s = p.read_text()
          og_anchor = '  <meta property="og:url" content="https://joenasriani.github.io/joe-research-registry/">\n'
          if 'property="og:image"' not in s:
              if og_anchor not in s:
                  raise SystemExit("Research root og:url anchor not found")
              s = s.replace(og_anchor, og_anchor + f'  <meta property="og:image" content="{image}">\n  <meta property="og:image:alt" content="Joe Nasr">\n', 1)
          tw_anchor = '  <meta name="twitter:card" content="summary">\n'
          if 'name="twitter:image"' not in s:
              if tw_anchor not in s:
                  raise SystemExit("Research root twitter anchor not found")
              s = s.replace(tw_anchor, tw_anchor + f'  <meta name="twitter:image" content="{image}">\n  <meta name="twitter:image:alt" content="Joe Nasr">\n', 1)
          person_anchor = '        "url": "https://joe-nasr-signals.vercel.app/v2/",\n        "jobTitle": "Creative Technologist",\n'
          if '"image": "https://avatars.githubusercontent.com/u/3828735?v=4"' not in s:
              if person_anchor not in s:
                  raise SystemExit("Research root Person anchor not found")
              s = s.replace(person_anchor, '        "url": "https://joe-nasr-signals.vercel.app/v2/",\n        "image": "' + image + '",\n        "jobTitle": "Creative Technologist",\n', 1)
          p.write_text(s)

          p = Path("author/joe-nasr.html")
          s = p.read_text()
          og_anchor = '  <meta property="og:url" content="https://joenasriani.github.io/joe-research-registry/author/joe-nasr.html">\n'
          if 'property="og:image"' not in s:
              if og_anchor not in s:
                  raise SystemExit("Author og:url anchor not found")
              s = s.replace(og_anchor, og_anchor + f'  <meta property="og:image" content="{image}">\n  <meta property="og:image:alt" content="Joe Nasr">\n  <meta name="twitter:card" content="summary">\n  <meta name="twitter:title" content="Joe Nasr — Research Author Record">\n  <meta name="twitter:description" content="Research authorship record linked to Joe Nasr’s canonical identity and technical research.">\n  <meta name="twitter:image" content="{image}">\n  <meta name="twitter:image:alt" content="Joe Nasr">\n', 1)
          person_anchor = '      "url": "https://joe-nasr-signals.vercel.app/v2/",\n      "jobTitle": "Creative Technologist",\n'
          if '"image": "https://avatars.githubusercontent.com/u/3828735?v=4"' not in s:
              if person_anchor not in s:
                  raise SystemExit("Author Person anchor not found")
              s = s.replace(person_anchor, '      "url": "https://joe-nasr-signals.vercel.app/v2/",\n      "image": "' + image + '",\n      "jobTitle": "Creative Technologist",\n', 1)
          p.write_text(s)

      - name: Remove one-time workflow
        run: rm .github/workflows/a3-image-metadata-once.yml
      - name: Commit canonical image metadata
        run: |
          git config user.name "Joe Nasr repository maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html author/joe-nasr.html .github/workflows/a3-image-metadata-once.yml
          git commit -m "Align research image metadata with canonical identity"
          git push
